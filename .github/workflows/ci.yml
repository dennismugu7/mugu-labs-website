name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      # Cheap smoke test: the page exists and every section actually rendered.
      # (The blog and the socials are off in lib/site.ts -> features; the
      # e2e "flags" project checks they come back when switched on.)
      - name: Check the export
        run: |
          test -f out/index.html || { echo "out/index.html is missing"; exit 1; }
          for id in products about work contact; do
            grep -q "id=\"$id\"" out/index.html || { echo "section #$id is missing from index.html"; exit 1; }
          done
          echo "index.html present, all four section anchors found"

      # Every internal link from every page, Back/forward, the fail-safes, at
      # desktop and phone size, against the export served locally.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
